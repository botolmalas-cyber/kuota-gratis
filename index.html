<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>kuota-gratis</title>
  <style>
    body{
      animation: latar 3s linear alternate infinite;
    }
    .emoji{
      text-align: center;
      position: relative;
      margin-top: 70%;
      font-size: 100px;
    }
    .teks{
      text-align: center;
      font-size: 50px;
      
      animation: warna 3s linear alternate infinite;
    }
    @keyframes warna{
      0% {color: red;}
      50% {color: green;}
      100% {color: blue;}
    }
    @keyframes latar{
      0% {background-color: black;}
      100% {background-color: white;}
    }
  </style>
</head>
<body>
  <p class="emoji">😂</p>
  <p class="teks">PRANK</p>
</body>
</html>
